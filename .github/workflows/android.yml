name: Android CI
on:
 push:
  branches: [ main, bvd-style-rebuild ]
 pull_request:
 workflow_dispatch:
permissions:
 contents: read
concurrency:
 group: android-${{ github.ref }}
 cancel-in-progress: true
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.9'
   - name: Check WebView JavaScript syntax
     run: node --check app/src/main/assets/web/js/app.js
   - name: Build and test
     run: gradle --no-daemon clean test assembleDebug
   - uses: actions/upload-artifact@v4
     with:
      name: bilibili-download-debug
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
